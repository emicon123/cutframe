# cargo-deny: licence, advisory and source policy. Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. GPL/AGPL/LGPL crates are not allowed (FFmpeg is linked separately as LGPL DLLs).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Mozilla's CA bundle as data, pulled in by rustls-platform-verifier only on wasm32 (never built
# here); it appears because cargo-deny checks every target. Permissive data licence.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# Our own crates are unpublished (publish = false).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
