[workspace]
resolver = "3"
members = ["crates/app-core", "crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
app-core = { path = "crates/app-core" }
engine = { path = "crates/engine" }

arc-swap = "1.9"
# Media fingerprints (CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception).
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-channel = "0.5"
pollster = "1.0"
raw-window-handle = "0.6"
# FFmpeg 7.1 bindings (LGPL shared build, dynamically linked; pin in scripts/ffmpeg.json). 0.18 targets
# FFmpeg 8. rsmpeg asks for rusty_ffmpeg ^0.16.1, a range that also holds the FFmpeg 8 releases
# (0.16.6+ffmpeg.8, 0.16.7+ffmpeg.8), so rusty_ffmpeg is pinned to the last FFmpeg 7.1 release that is
# not yanked. Update both together with the FFmpeg pin.
rsmpeg = { version = "=0.17.0", default-features = false, features = ["ffmpeg7_1"] }
rusty_ffmpeg = { version = "=0.16.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.28", features = ["derive", "uuid"] }
specta-typescript = "=0.0.15"
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
# Reveal a media file in Explorer from Rust (`reveal_item_in_dir`); the plugin itself is not
# registered, so the webview gets no opener permissions.
tauri-plugin-opener = "2.7"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
wgpu = "30"
windows = "0.62"

proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Keep debug builds usable for real-time rendering and decoding.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
