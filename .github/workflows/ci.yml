name: CI

# Manual only (decision of 2026-11-22): local checks on the Windows machine are the gate, so CI does
# not run on push or pull requests. Start it with `gh workflow run ci.yml` when a clean-checkout run
# is wanted (before a release, after packaging changes).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows is the only platform (CLAUDE.md, decision of 2026-11-22). Local checks on the developer's
  # Windows machine are the gate; this job is an optional, manually started clean-checkout run.
  # Cheap checks run first so a formatting or UI error fails within minutes, before the Rust build.
  windows:
    name: Windows (checks, tests, licences, installer, smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2 # reads rust-toolchain.toml (rustfmt, clippy), caches cargo
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # bindgen 0.71 (rusty_ffmpeg 0.16, FFmpeg 7.1) turns AVFormatContext & co. into opaque types
      # with libclang 21+, so rsmpeg needs LLVM 20 (README). The runner image may ship a newer LLVM,
      # so install the pinned 20.1.8 into the cache dir and point LIBCLANG_PATH at it before the
      # FFmpeg step (fetch-ffmpeg.ps1 keeps an existing LIBCLANG_PATH).
      - uses: actions/cache@v5
        id: llvm-cache
        with:
          path: ${{ runner.temp }}\llvm-20.1.8
          key: llvm-20.1.8-win64
      - name: Install LLVM 20.1.8 (libclang for bindgen)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'LLVM-20.1.8-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe' -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($hash -ne '3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b') { throw "LLVM installer SHA-256 mismatch: $hash" }
          $dest = Join-Path $env:RUNNER_TEMP 'llvm-20.1.8'
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "LLVM installer exited with $($p.ExitCode)" }
      - name: Use LLVM 20.1.8 for bindgen
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'llvm-20.1.8\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'libclang.dll'))) { throw "libclang.dll not found in $bin" }
          "LIBCLANG_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Pinned LGPL shared FFmpeg (scripts/ffmpeg.json): download, SHA-256 check, licence gate
      # (scripts/check-ffmpeg-license.ps1 fails on any non-LGPL DLL or GPL configure flag), then
      # FFMPEG_DIR / FFMPEG_INCLUDE_DIR / FFMPEG_LIBS_DIR / FFMPEG_LINK_MODE / LIBCLANG_PATH go to
      # GITHUB_ENV and .ffmpeg\bin to GITHUB_PATH. Must run before any cargo step: src-tauri's
      # bundle.resources glob needs .ffmpeg\bin\*.dll and rsmpeg links against .ffmpeg\lib.
      - name: Provision FFmpeg (pinned, SHA-256 and LGPL checked)
        run: ./scripts/fetch-ffmpeg.ps1

      # Third-party licence notices for the About dialog (ui/src/generated/licenses.json): Rust crates
      # linked into the app, bundled npm packages, the Rust std and the FFmpeg LGPL notice + source
      # offer. Runs after the FFmpeg step (it reads .ffmpeg\NOTICE.txt) and before the UI build; it
      # fails on a package without licence or licence text and on GPL/AGPL/LGPL-only npm packages.
      - name: Third-party licence notices
        run: pnpm gen:licenses

      # .gitattributes forces LF in every checkout (core.autocrlf=true included), so rustfmt and
      # Prettier see the same bytes as on any other machine.
      - run: cargo fmt --all --check

      # One step per check: unless $PSNativeCommandUseErrorActionPreference is on, the default pwsh
      # shell fails a step only on the exit code of its LAST native command, so a multi-line `run:`
      # could hide an earlier failure.
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui lint
      - run: pnpm --dir ui exec prettier --check .
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build

      # Covers cfg(windows) code too (preview/windows.rs, the MSVC branch of build.rs). Runs before
      # the tests to fail fast; it shares build scripts and proc macros with them.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (GPU tests run on WARP)
        run: cargo test --workspace

      # `cargo test` runs `export_typescript_bindings`, which rewrites ui/src/bindings.ts. git
      # compares it after LF normalisation (.gitattributes), so only real contract drift fails here.
      - name: Generated bindings are up to date
        run: git diff --exit-code -- ui/src/bindings.ts

      # taiki-e/install-action downloads a prebuilt binary; EmbarkStudios/cargo-deny-action is a
      # Docker container action and does not run on Windows runners. The tool version is pinned so a
      # new cargo-deny release cannot change the policy check without a commit.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      # --all-features (as the old action ran it) also covers optional dependencies, even though
      # deny.toml's [graph] defaults to the default feature set for a plain local `cargo deny check`.
      - name: Licences, advisories, bans and sources (cargo-deny)
        run: cargo deny --all-features check

      - name: Build NSIS installer
        run: pnpm tauri build

      # `--smoke-test` (src-tauri/src/smoke_test.rs) renders one offscreen frame, then presents 30
      # frames into the native preview child window (ADR-0005 §7). The runner has no GPU, so the
      # normal adapter selection ends on WARP; WGPU_FORCE_FALLBACK_ADAPTER is deliberately not set,
      # so CI walks the same selection path as users' machines.
      - name: Install silently and run the smoke test
        shell: pwsh
        timeout-minutes: 5 # backstop; the app's own watchdog exits with code 5 after 90 s
        env:
          NO_COLOR: "1" # plain tracing output, no ANSI escapes
        run: |
          # Like a user's machine: the installed exe must load the FFmpeg DLLs that the installer put
          # next to it, not the provisioned .ffmpeg\bin that the build steps put on PATH.
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notlike '*\.ffmpeg\bin' }) -join ';'
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Cutframe'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "App not found in $dir" }

          # Exit codes of src-tauri/src/smoke_test.rs (keep in sync with `Outcome`).
          $reasons = @{
            1 = 'no offscreen frame rendered'
            2 = 'no GPU adapter, the preview is unavailable'
            3 = 'no adapter can present to the native preview window'
            4 = 'fewer than 30 frames presented to the preview window within 20 s'
            5 = 'watchdog: the smoke test did not finish within 90 s (hang)'
            6 = 'linked FFmpeg failed the LGPL licence check'
          }

          # The release exe is a GUI-subsystem app: Start-Process -Wait loses its log, piping keeps
          # stdout (tracing) and $LASTEXITCODE. stderr is merged so panics end up in the log; it must
          # not fail the step by itself (WebView2 may print "Failed to unregister class ..."), and a
          # non-zero exit code must not throw before the log is printed.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = & $exe.FullName --smoke-test 2>&1 | ForEach-Object { "$_" } | Out-String
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $log = $log -replace "$([char]27)\[[0-9;]*m", ''

          Write-Host "----- smoke test log ($($exe.FullName)) -----"
          Write-Host $log.TrimEnd()
          Write-Host "----- exit code $code -----"

          function Fail([string] $message) {
            Write-Host "::error title=Smoke test failed::$message"
            exit 1
          }
          if ($code -ne 0) {
            $reason = $reasons[$code]
            if (-not $reason) { $reason = 'unexpected exit code (crash or panic?)' }
            Fail ('exit code {0} (0x{0:X8}): {1}' -f $code, $reason)
          }
          # Exit 0 alone is not enough: a silent fallback to the offscreen `frames` mode must not pass.
          $line = $log -split "`r?`n" | Where-Object { $_ -match 'smoke test passed' } | Select-Object -Last 1
          if (-not $line) { Fail 'exit code 0 but no "smoke test passed" line in the log' }
          if ($line -notmatch '\bmode=Native\b') { Fail "preview is not in Native mode: $line" }
          if ($line -notmatch '\bbackend=Dx12\b') { Fail "preview is not on D3D12 (ADR-0001): $line" }
          if ($line -notmatch '\bpresented=(\d+)\b' -or [int]$Matches[1] -lt 30) {
            Fail "fewer than 30 frames presented: $line"
          }
          Write-Host "Smoke test passed: $line"

      # Licence gate on what users actually get: the DLLs the installer put next to the .exe.
      # Separate steps, so each one fails on its own exit code.
      - name: Installed FFmpeg DLLs are the pinned LGPL build
        run: ./scripts/check-ffmpeg-license.ps1 -Path (Join-Path $env:LOCALAPPDATA 'Cutframe')

      - name: Installed FFmpeg licence and notice are present
        run: |
          foreach ($f in 'licenses\ffmpeg\LICENSE.txt', 'licenses\ffmpeg\NOTICE.txt') {
            $p = Join-Path (Join-Path $env:LOCALAPPDATA 'Cutframe') $f
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "missing $p" }
          }
          if (-not (Select-String -LiteralPath (Join-Path $env:LOCALAPPDATA 'Cutframe\licenses\ffmpeg\LICENSE.txt') -Pattern 'GNU LESSER GENERAL PUBLIC LICENSE' -Quiet)) {
            throw 'licenses\ffmpeg\LICENSE.txt is not the LGPL text'
          }

      # File association (docs/design/platform-integration.md §5): Tauri's NSIS template writes it
      # with `SHELL_CONTEXT` (= SHCTX), which `SetShellVarContext current` (installMode currentUser)
      # maps to HKCU. The runner is an admin account, so a silent install cannot prove "no UAC";
      # instead the installer's manifest must request `asInvoker` (RequestExecutionLevel user), and
      # nothing may land in HKLM.
      - name: File association is per-user (HKCU, no admin)
        shell: pwsh
        run: |
          function Fail([string] $message) {
            Write-Host "::error title=File association check failed::$message"
            exit 1
          }
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'requestedExecutionLevel\s+level="(\w+)"') { Fail 'no requestedExecutionLevel in the installer manifest' }
          if ($Matches[1] -ne 'asInvoker') { Fail "installer requests elevation: level=$($Matches[1])" }

          $dir = Join-Path $env:LOCALAPPDATA 'Cutframe'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { Fail "App not found in $dir" }
          $ext = 'HKCU:\Software\Classes\.cutframe'
          $progId = 'HKCU:\Software\Classes\Cutframe.Project'
          if (-not (Test-Path $ext)) { Fail "$ext is missing" }
          $extDefault = (Get-Item $ext).GetValue('')
          if ($extDefault -ne 'Cutframe.Project') { Fail "$ext default is '$extDefault', expected 'Cutframe.Project'" }
          if (-not (Test-Path "$progId\shell\open\command")) { Fail "$progId\shell\open\command is missing" }
          $command = (Get-Item "$progId\shell\open\command").GetValue('')
          $expected = '"{0}" "%1"' -f $exe.FullName
          if ($command -ne $expected) { Fail "open command is '$command', expected '$expected'" }
          foreach ($key in 'HKLM:\Software\Classes\.cutframe', 'HKLM:\Software\Classes\Cutframe.Project') {
            if (Test-Path $key) { Fail "$key exists: the association must be per-user" }
          }
          Write-Host "Association OK: .cutframe -> Cutframe.Project -> $command (installer level=asInvoker)"

      # APP_UNASSOCIATE deletes the ProgID key and restores `.cutframe`'s previous default value (empty
      # on a fresh runner); it leaves the `.cutframe` key with a `Cutframe.Project_backup` value behind.
      # `_?=` runs the uninstaller in place, so -Wait really waits for it (it does not delete itself).
      - name: Uninstall silently and check the association is removed
        shell: pwsh
        run: |
          function Fail([string] $message) {
            Write-Host "::error title=Uninstall check failed::$message"
            exit 1
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Cutframe'
          $uninstaller = Join-Path $dir 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { Fail "$uninstaller is missing" }
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "uninstaller exited with $($p.ExitCode)" }
          $progId = 'HKCU:\Software\Classes\Cutframe.Project'
          if (Test-Path $progId) { Fail "$progId still exists after uninstall" }
          $ext = 'HKCU:\Software\Classes\.cutframe'
          if (Test-Path $ext) {
            $extDefault = (Get-Item $ext).GetValue('')
            if ($extDefault -eq 'Cutframe.Project') { Fail "$ext still points at Cutframe.Project" }
          }
          $left = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' }
          if ($left) { Fail "app exe still present after uninstall: $($left.FullName -join ', ')" }
          Write-Host 'Uninstall OK: ProgID removed, .cutframe no longer associated, app exe deleted'

      - uses: actions/upload-artifact@v7
        with:
          name: cutframe-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
