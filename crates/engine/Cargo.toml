[package]
name = "engine"
description = "Rendering, media and audio engine. Knows nothing about Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `PreviewHandle::detached` and `WakeProbe`: a preview without a render thread or GPU, for tests of
# the shell (`src-tauri` enables it for its tests only).
test-support = []

[dependencies]
app-core.workspace = true
blake3.workspace = true
bytemuck.workspace = true
arc-swap.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
rsmpeg.workspace = true
rtrb.workspace = true
# Not used directly: pins the FFmpeg 7.1 release of rsmpeg's FFI crate (see the workspace Cargo.toml).
rusty_ffmpeg.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
# D3D12VA interop with wgpu's own device (`media::d3d12`, render-graph.md §5.4); COM for the
# Media Foundation encoders (`export::encoders::ComGuard`).
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
] }

[dev-dependencies]
# Debug snapshots of render plans (render-graph.md §12).
insta.workspace = true
# Reads and writes the golden-frame PNGs (`tests/golden.rs`).
png.workspace = true
# Logs (and counts D3D12 debug-layer messages) in the ignored hardware-decode spike tests.
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true
