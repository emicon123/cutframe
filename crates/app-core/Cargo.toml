[package]
name = "app-core"
description = "Project model, edit commands and undo/redo history. Pure: no GPU, media or UI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` so the Tauri shell can expose model types over IPC.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
